{% extends 'base_auth.html' %}

{% block title %}Techo Drill Innovation - Password Changed{% endblock %}

{% block content %}
<div class="w-full max-w-md bg-white dark:bg-[#1a2632] rounded-2xl shadow-xl overflow-hidden flex flex-col relative">
    <!-- Decorative Top Pattern -->
    <div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-primary to-blue-400"></div>

    <!-- Header Section -->
    <div class="px-6 mt-8 mb-6 flex flex-col items-center text-center">
        <div class="w-14 h-14 rounded-full bg-green-500/10 flex items-center justify-center mb-4">
             <span class="material-symbols-outlined text-green-500 text-3xl">task_alt</span>
        </div>
        <h1 class="text-2xl font-bold tracking-tight mb-2">Password Reset</h1>
        <p class="text-slate-500 dark:text-slate-400 text-sm max-w-xs">Your password has been successfully reset. You can now use your new credentials to access the portal.</p>
    </div>

    <!-- Navigation -->
    <div class="px-6 py-6 border-t border-slate-50 dark:border-slate-800/50">
        <a href="{% url 'login' %}" class="inline-flex items-center gap-2 bg-primary hover:bg-primary-dark text-white font-bold py-3.5 rounded-xl w-full justify-center shadow-lg shadow-primary/30 transition-all active:scale-95">
             <span>Login Now</span>
             <span class="material-symbols-outlined text-[20px]">login</span>
        </a>
    </div>

</div>
{% endblock %}
